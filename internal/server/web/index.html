<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>landscape</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="login" class="hide">
  <div class="card">
    <h1>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#35d0c0" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7.1 7 16.9 11M7.1 17 16.9 13"/></svg>
      landscape
    </h1>
    <div class="sub">projects.sujaykumar.dev</div>
    <div class="nexthint hide" id="nexthint"></div>
    <form id="loginform">
      <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" autofocus>
      <button type="submit">Unlock console</button>
      <div class="err" id="loginerr"></div>
    </form>
    <div class="foot">Read-only view of the GitOps landscape — no write access to the cluster.</div>
  </div>
</div>

<div id="app" class="hide">
  <div id="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#35d0c0" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7.1 7 16.9 11M7.1 17 16.9 13"/></svg>
      landscape
    </div>
    <div class="nav">
      <button data-view="map" class="on" title="Landscape">
        <svg class="ni" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="nl">Landscape</span>
      </button>
      <button data-view="metrics" title="Metrics">
        <svg class="ni" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 4-5"/></svg>
        <span class="nl">Metrics</span>
      </button>
      <button data-view="events" title="Events">
        <svg class="ni" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        <span class="nl">Events</span>
      </button>
      <button data-view="storage" title="Storage">
        <svg class="ni" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        <span class="nl">Storage</span>
      </button>
      <button data-view="longhorn" title="Longhorn">
        <svg class="ni" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.6"/><rect x="3" y="13" width="18" height="7" rx="1.6"/><path d="M7 7.5h.01M7 16.5h.01M11 7.5h6M11 16.5h6"/></svg>
        <span class="nl">Longhorn</span>
      </button>
    </div>
    <div id="crumb" class="hide">
      <span class="home">Landscape</span>
      <span class="sep"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 6l6 6-6 6"/></svg></span>
      <span class="cur"></span>
    </div>
    <div class="grow"></div>
    <div class="rightbar">
      <div id="health" class="chip">…</div>
      <div id="usage" class="usage"></div>
      <div class="menu" id="evmenu">
        <button class="iconbtn" id="evmenubtn" title="Events & warnings" aria-haspopup="true" aria-expanded="false" aria-controls="evmenupop">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        </button>
        <div class="menupop hide" id="evmenupop" role="menu" aria-label="Events">
          <button role="menuitem" data-act="events">Events browser</button>
          <button role="menuitem" data-act="warnings">Recent warnings</button>
        </div>
      </div>
      <div class="profile">
        <div class="avatar">A</div>
        <span class="who">admin</span>
        <button class="iconbtn" id="logout" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="view"></div>
</div>

<div id="hover" class="hide"></div>

<script src="./app.js"></script>
</body>
</html>
